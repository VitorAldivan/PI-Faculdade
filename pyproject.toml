[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-dps-gestao"
version = "2.0.0"
description = "Sistema Moderno de Gestão de Ordens de Serviço e Análise de Dados - Nova DPS Informática"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "PySide6-Fluent-Widgets>=1.5.0",
    "SQLAlchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "pandas>=2.1.0",
    "reportlab>=4.0.0",
    "xlsxwriter>=3.1.0",
    "faker>=24.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.3.0"
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
